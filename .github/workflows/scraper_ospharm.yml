name: Scraper OSPHARM

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Supabase user ID'
        required: true
  workflow_call:
    inputs:
      user_id:
        description: 'Supabase user ID'
        required: true
        type: string

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Run scraper OSPHARM
        env:
          USER_ID: ${{ inputs.user_id }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 api_scraper/run_job_ospharm.py

      # Captures d'écran + HTML de la page au moment de l'échec. Sans elles, un
      # scraping cassé n'est pas diagnosticable : on ne voit pas ce que le robot
      # voyait. `if: always()` pour qu'elles remontent SURTOUT quand ça échoue.
      - name: Publier les captures du scraper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ospharm-captures-${{ github.run_number }}
          path: ospharm_snaps/
          retention-days: 14
          if-no-files-found: ignore
